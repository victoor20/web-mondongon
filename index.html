<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Academia · Tests AGE C1</title>
<style>
  :root{--bg:#f4f6fb;--ink:#17243b;--muted:#66748b;--line:#e1e7ef;--blue:#2856d9;--blueLight:#eef3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
  .shell{max-width:760px;margin:auto;padding:28px 18px 60px}
  .logo{font-weight:850;font-size:21px;letter-spacing:-.6px;display:flex;gap:11px;align-items:center}
  .mark{background:var(--blue);color:#fff;border-radius:12px;width:39px;height:39px;display:grid;place-items:center}
  h1{font-size:clamp(26px,4vw,36px);letter-spacing:-1px;margin:26px 0 6px}
  .muted{color:var(--muted)}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:18px 0 8px}
  input:focus-visible{outline:3px solid #8daeff}
  .count{font-size:13px;color:var(--muted);margin-bottom:12px}
  a.test{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0;color:inherit;text-decoration:none;transition:border-color .15s}
  a.test:hover{border-color:var(--blue);background:var(--blueLight)}
  a.test strong{font-weight:720}
  .date{font-size:12px;color:var(--muted);white-space:nowrap}
  .arrow{color:var(--blue);font-weight:800}
  .msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <div class="logo"><span class="mark">✦</span> Mi Academia</div>
  <h1>Tests · Administrativo AGE C1</h1>
  <p class="muted">Todos tus tests en un solo sitio. Los más recientes aparecen primero.</p>
  <input id="buscar" type="search" placeholder="Buscar test…" aria-label="Buscar test">
  <div class="count" id="count"></div>
  <div id="lista"><div class="msg">Cargando tests…</div></div>
</div>

<script>
// ===== CONFIGURACIÓN (cambia solo si tu repo se llama distinto) =====
const GH_USER = 'victoor20';
const GH_REPO = 'web-mondongon';
const CARPETA = 'tests';
// ====================================================================
// Nombres recomendados: 2026-10-28_constitucion_1_9.html  (fecha_tema.html)

const lista = document.getElementById('lista');
const count = document.getElementById('count');
let tests = [];

function bonito(nombre) {
  const m = nombre.match(/^(\d{4})-(\d{2})-(\d{2})[_-](.+)\.html$/i);
  let fecha = '', base = nombre.replace(/\.html$/i, '');
  if (m) { fecha = `${m[3]}/${m[2]}/${m[1]}`; base = m[4]; }
  base = base.replace(/^test[_-]/i, '').replace(/[_-]+/g, ' ').trim();
  return { fecha, titulo: base.charAt(0).toUpperCase() + base.slice(1) };
}

function pintar(filtro = '') {
  const f = filtro.toLowerCase();
  const vis = tests.filter(t => (t.titulo + ' ' + t.fecha).toLowerCase().includes(f));
  count.textContent = `${vis.length} test${vis.length === 1 ? '' : 's'}`;
  lista.replaceChildren();
  if (!vis.length) {
    const d = document.createElement('div'); d.className = 'msg';
    d.textContent = tests.length ? 'Ningún test coincide con la búsqueda.' : 'Aún no hay tests. Sube un archivo .html a la carpeta tests/.';
    lista.append(d); return;
  }
  vis.forEach(t => {
    const a = document.createElement('a'); a.className = 'test'; a.href = t.url;
    const s = document.createElement('strong'); s.textContent = t.titulo;
    const r = document.createElement('span'); r.className = 'date';
    r.textContent = (t.fecha ? t.fecha + '  ' : '') ;
    const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '→';
    r.append(ar);
    a.append(s, r); lista.append(a);
  });
}

fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${CARPETA}`)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(files => {
    tests = files
      .filter(f => f.type === 'file' && /\.html$/i.test(f.name))
      .map(f => ({ name: f.name, url: `${CARPETA}/${encodeURIComponent(f.name)}`, ...bonito(f.name) }))
      .sort((a, b) => b.name.localeCompare(a.name));
    pintar();
  })
  .catch(() => {
    lista.innerHTML = '<div class="msg">No se pudo cargar la lista de tests. Comprueba que el repositorio es público y que GH_USER / GH_REPO son correctos.</div>';
  });

document.getElementById('buscar').addEventListener('input', e => pintar(e.target.value));
</script>
</body>
</html>
