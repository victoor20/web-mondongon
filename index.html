<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Academia</title>
<script>try{var t=JSON.parse(localStorage.getItem('ma2_prefs')||'{}').tema;if(t==='claro'||t==='oscuro')document.documentElement.dataset.tema=t}catch(e){}</script>
<meta name="theme-color" content="#E9ECF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Academia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=20261121">
</head>
<body data-pagina="inicio">
<div class="wrap">
  <div class="pagehead">
    <h1 class="titular">Tu preparación</h1>
    <p class="entradilla" id="estado">Administrativo del Estado (C1).</p>
  </div>

  <div id="continuar"></div>

  <section class="hoy-sec" aria-labelledby="hoy-t">
    <h2 class="h-sec" id="hoy-t">Para hoy</h2>
    <div class="hoy-grid" id="empezar"></div>
    <div id="sugerencias"></div>
  </section>

  <section class="hoja hoja-resp" aria-labelledby="mapa-t">
    <div class="hr-cab">
      <h2 id="mapa-t">Hoja de respuestas</h2>
      <p>Cada círculo es un tema. Se rellena según tu acierto en los últimos intentos.</p>
    </div>
    <div id="mapa-filas"></div>
    <div class="minfo" id="minfo" aria-live="polite"><span class="fine">Toca un círculo para ver el tema.</span></div>
    <div class="leyenda" aria-hidden="true">
      <span><i class="b-no"></i>Sin tests</span>
      <span><i class="b-si"></i>Con tests, sin intentos</span>
      <span><i class="b-ac"></i>Relleno: tu acierto</span>
      <span><i class="b-bj"></i>Bajo el 60 %</span>
    </div>
  </section>

  <section class="hoy-sec" aria-labelledby="ult-t">
    <h2 class="h-sec" id="ult-t">Últimos resultados</h2>
    <div id="ultimos"></div>
  </section>
</div>
<script src="app.js?v=20261121"></script>
<script src="vistas.js?v=20261121"></script>
<script>
let selTema = null, primera = true;

function renderEstado() { $('estado').textContent = fraseEstado(); }

function renderEmpezar() {
  const box = $('empezar'); box.replaceChildren();
  const nErr = Object.keys(getErr()).length, nDud = Object.keys(getDud()).length, total = totalPreguntas();
  const m = el('div', 'mixto' + (total ? '' : ' off'));
  const bub = el('div', 'mixto-bub'); bub.setAttribute('aria-hidden', 'true');
  ['A', 'B', 'C', 'D'].forEach((l, i) => bub.append(el('i', i === 2 ? 'x' : '', l)));
  m.append(bub, el('h3', '', 'Test mixto'),
    el('p', '', total ? `Preguntas al azar de todos tus tests (${plural(total, 'pregunta', 'preguntas')}). ¿Cuántas?` : 'Aparecerá cuando haya tests publicados.'));
  const ch = el('div', 'nchips');
  [10, 20, 30, 50, 70, 100].filter(x => x < total).forEach(x => { const a = el('a', '', String(x)); a.href = `test.html?t=mixto&n=${x}`; ch.append(a); });
  if (total) { const a = el('a', '', 'Todas'); a.href = `test.html?t=mixto&n=${total}`; ch.append(a); }
  m.append(ch);
  const lado = el('div', 'hoy-lado');
  const tarjeta = (n, titulo, vacio, lleno, href) => {
    const a = el('a', 'accion' + (n ? '' : ' off')); a.href = href;
    a.append(el('span', 'accion-n', String(n)), el('h3', '', titulo), el('p', '', n ? lleno : vacio)); return a;
  };
  lado.append(
    tarjeta(nErr, 'Errores', 'Nada pendiente de repasar.', `${plural(nErr, 'pregunta fallada', 'preguntas falladas')} por repasar.`, 'test.html?t=errores'),
    tarjeta(nDud, 'Dudas', 'Ninguna pregunta marcada con la estrella.', `${plural(nDud, 'pregunta marcada', 'preguntas marcadas')} con la estrella.`, 'test.html?t=dudosas'));
  box.append(m, lado);
}
function renderSugerencias() {
  const box = $('sugerencias'); box.replaceChildren();
  const filas = [];
  const conDatos = Object.entries(TS).filter(([t]) => _temario.byId[t] && cnt[t]);
  const flojos = conDatos.filter(([, a]) => a.reciente.t >= 10).sort((x, y) => pct(x[1].reciente) - pct(y[1].reciente));
  const flojo = flojos.length && pct(flojos[0][1].reciente) < 85 ? flojos[0][0] : null;
  if (flojo) filas.push([`Tu tema más flojo ahora es ${temaLabel(flojo)}, con un ${pct(TS[flojo].reciente)} % en tus últimos intentos.`, 'Practicar', urlMixto(flojo)]);
  const viejo = conDatos.filter(([t, a]) => t !== flojo && (Date.now() - new Date(a.ultima).getTime()) / 864e5 >= 7).sort((x, y) => x[1].ultima.localeCompare(y[1].ultima))[0];
  if (viejo) filas.push([`${temaLabel(viejo[0])}. Lo practicaste por última vez ${haceTexto(viejo[1].ultima)}.`, 'Practicar', urlMixto(viejo[0])]);
  const sinIntento = Object.keys(cnt).filter(t => _temario.byId[t] && !TS[t]);
  if (sinIntento.length && Object.keys(TS).length) filas.push([`${plural(sinIntento.length, 'tema tiene', 'temas tienen')} tests que aún no has hecho.`, 'Ver el primero', urlMixto(sinIntento[0])]);
  filas.forEach(([txt, bt, href]) => {
    const f = el('div', 'hoy-fila'), a = el('a', 'btn small ghost', bt); a.href = href;
    f.append(el('p', '', txt), a); box.append(f);
  });
}
function renderContinuar() {
  const box = $('continuar'); box.replaceChildren();
  Object.keys(localStorage).filter(k => k.startsWith(LS.curso)).forEach(k => {
    const s = jget(localStorage, k, null); if (!s || !Array.isArray(s.exam) || !s.exam.length) return;
    const t = new URLSearchParams(k.slice(LS.curso.length)).get('t'), it = items.find(i => i.id === t);
    const nombre = t === 'mixto' ? 'Test mixto' : t === 'errores' ? 'Repaso de errores' : t === 'dudosas' ? 'Repaso de dudas' : (it ? it.titulo : 'Test');
    const n = s.exam.filter(x => x.selected !== null).length;
    const d = el('div', 'continuar');
    const tx = el('p', ''); tx.append(el('strong', '', 'Tienes un test sin terminar. '), `${nombre}: ${n} de ${s.exam.length} respondidas.`);
    const a = el('a', 'btn small', 'Continuar'); a.href = 'test.html' + k.slice(LS.curso.length);
    const b = el('button', 'btn small ghost', 'Descartar'); b.type = 'button';
    b.addEventListener('click', () => { if (confirm(`¿Descartar «${nombre}»? Se pierde lo respondido hasta ahora.`)) { cursoDel(k); refresh(); sincronizar(); } });
    const ac = el('div', 'continuar-ac'); ac.append(a, b);
    d.append(tx, ac); box.append(d);
  });
}
function selectTema(id) {
  selTema = id;
  document.querySelectorAll('.burbuja').forEach(c => c.classList.toggle('on', c.dataset.id === id));
  const t = _temario.byId[id], box = $('minfo'); box.replaceChildren();
  if (!t) return;
  box.dataset.b = bloqueOf(id);
  const tx = el('p', ''); tx.append(el('strong', '', `${codigoTema(t.id)} ${t.corto}`), el('span', '', resumenTema(t)));
  const ac = el('div', 'minfo-ac');
  const ver = el('a', 'mini', 'Ver en el temario'); ver.href = `temario.html#tema-${t.id}`; ac.append(ver);
  if (cnt[id]) { const pr = el('a', 'mini azul', 'Practicar'); pr.href = urlMixto(id); ac.append(pr); }
  box.append(tx, ac);
}
function renderHoja() {
  const box = $('mapa-filas'); box.replaceChildren();
  let idx = 0; const fills = [];
  _temario.bloques.forEach(b => {
    const row = el('div', 'hr-row'); row.dataset.b = b.id;
    const lab = el('div', 'hr-lab'); lab.append(el('b', '', b.id), el('span', '', b.titulo));
    const cells = el('div', 'hr-cells');
    b.temas.forEach(t => {
      const c = cnt[t.id], r = reciente(t.id);
      const btn = el('button', 'burbuja' + (c ? ' has' : '') + (r && pct(r) < 60 ? ' weak' : '') + (selTema === t.id ? ' on' : ''));
      btn.type = 'button'; btn.dataset.id = t.id;
      btn.setAttribute('aria-label', `${codigoTema(t.id)} ${t.corto}: ${resumenTema(t)}`);
      btn.title = `${codigoTema(t.id)} ${t.corto}`;
      fills.push([btn, r ? pct(r) : 0, idx++]);
      btn.append(el('b', '', String(t.n)));
      btn.addEventListener('click', () => selectTema(t.id));
      cells.append(btn);
    });
    row.append(lab, cells); box.append(row);
  });
  const apply = () => fills.forEach(([b, p, i]) => { b.style.transitionDelay = (i * 18) + 'ms'; b.style.setProperty('--p', p); });
  if (primera) requestAnimationFrame(() => requestAnimationFrame(apply)); else apply();   // un único movimiento al cargar
  primera = false;
}
function renderUltimos() {
  const box = $('ultimos'); box.replaceChildren();
  const h = getHist().slice(0, 5);
  if (!h.length) { box.append(el('p', 'vacio-msg', 'Todavía no has hecho ningún test. Empieza con uno mixto o abre un test desde «Tests».')); return; }
  const lista = el('div', 'res-lista');
  h.forEach(e => {
    const p = e.total ? Math.round(e.right / e.total * 100) : 0;
    const a = el('a', 'res-fila'); a.href = `test.html?t=${encodeURIComponent(e.id)}`;
    const m = el('div'); m.append(el('div', 'res-tit', String(e.titulo || '').replace(' · ', ': ')), el('div', 'fine', `${haceTexto(e.date)}, ${plural(e.right, 'acierto', 'aciertos')} de ${e.total}`));
    a.append(m, el('b', 'res-pct' + (p < 60 ? ' low' : ''), p + ' %')); lista.append(a);
  });
  box.append(lista);
}
function refresh() { computeData(); renderEstado(); renderEmpezar(); renderSugerencias(); renderContinuar(); renderHoja(); renderUltimos(); if (selTema) selectTema(selTema); }
async function sincronizar() {
  const r = await syncNow();
  if (r.cambioLocal) refresh();
  pintaAvisoToken();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && getToken()) sincronizar(); });
async function init() {
  await loadTemario(); refresh();
  await cargarCatalogo(); refresh();
  const off = offInfo();                                         // si ya la guardaste, se renueva sola de vez en cuando
  if (off.t && navigator.onLine !== false && Date.now() - off.t > OFF.maxEdad) guardarOffline(items).catch(() => { /* nada */ });
  if (getToken()) sincronizar();
}
window.addEventListener('online', () => { if (getToken()) sincronizar(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && getToken() && items.length) sincronizar(); });
init();
</script>
<script src="temporizador.js?v=20261121"></script>
</body>
</html>
