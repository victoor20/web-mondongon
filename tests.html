<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tests - Mi Academia</title>
<script>try{var t=JSON.parse(localStorage.getItem('ma2_prefs')||'{}').tema;if(t==='claro'||t==='oscuro')document.documentElement.dataset.tema=t}catch(e){}</script>
<meta name="theme-color" content="#E9ECF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Academia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=20261126">
</head>
<body data-pagina="tests">
<div class="wrap">
  <div class="pagehead pagehead-fila">
    <div>
      <h1 class="titular">Tests</h1>
      <p class="entradilla">Practica con preguntas mezcladas o abre un test concreto.</p>
    </div>
    <a class="btn" href="nuevo.html">Añadir test</a>
  </div>

  <section class="practica-sec" aria-labelledby="pr-t">
    <h2 class="h-sec" id="pr-t">Practicar</h2>
    <div class="hoy-grid" id="practica"></div>
  </section>

  <section id="seccion-tests">
    <h2 class="h-sec">Todos tus tests</h2>
    <div class="filtros hoja pad">
      <input type="search" id="buscar" placeholder="Buscar un test" aria-label="Buscar un test">
      <div class="chips" id="chips"></div>
      <div class="chips estado" id="chips-estado"></div>
      <div class="chips origen" id="chips-origen"></div>
    </div>
    <div class="barra">
      <label>Mostrar <select id="pp" aria-label="Tests por página"></select></label>
      <label>Ordenar <select id="orden" aria-label="Orden"></select></label>
      <span class="fine" id="cuenta"></span>
    </div>
    <div class="lista" id="lista"><p class="vacio-msg">Cargando tests…</p></div>
    <div class="pager hide" id="pager">
      <button type="button" class="btn small ghost" id="ant">Anterior</button>
      <span id="pag"></span>
      <button type="button" class="btn small ghost" id="sig">Siguiente</button>
    </div>
    <div id="avisos"></div>
  </section>
</div>
<script src="app.js?v=20261126"></script>
<script src="vistas.js?v=20261126"></script>
<script>
let fBloque = 'Todos', fTema = new URLSearchParams(location.search).get('tema'), fFuente = 'Todos', fEstado = 'Todos', pagina = 1;
const ORDENES = {
  recientes: ['Más recientes primero', (a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.id.localeCompare(a.id)],
  antiguos: ['Más antiguos primero', (a, b) => (a.fecha || '').localeCompare(b.fecha || '') || a.id.localeCompare(b.id)],
  nombre: ['Nombre (A–Z)', (a, b) => a.titulo.localeCompare(b.titulo, 'es', { numeric: true })],
  peor: ['Peor nota primero', (a, b) => ((statsFor(a.id) || { ultimoPct: 101 }).ultimoPct) - ((statsFor(b.id) || { ultimoPct: 101 }).ultimoPct)],
  sinhacer: ['Sin hacer primero', (a, b) => (statsFor(a.id) ? 1 : 0) - (statsFor(b.id) ? 1 : 0) || (b.fecha || '').localeCompare(a.fecha || '')]
};
const TAMANOS = [5, 10, 25, 50, 100, 0];     // 0 = todos
const itemTemas = it => Object.keys(it.temas || {});
function estadoDe(it) {                                         // 'curso' > 'hecho' > 'nuevo'
  if (it.kind === 'json') { const q = it.url.slice(it.url.indexOf('?')), c = cursosRaw()[q]; if (c && !c.del) return 'curso'; }
  return statsFor(it.id) ? 'hecho' : 'nuevo';
}
function matches(it) {
  if (fTema && !itemTemas(it).includes(fTema)) return false;
  if (fFuente !== 'Todos' && it.fuente !== fFuente) return false;
  if (fBloque === 'Sin clasificar') return it.kind === 'html' || !itemTemas(it).some(t => bloqueOf(t));
  if (fBloque !== 'Todos' && !itemTemas(it).some(t => bloqueOf(t) === fBloque)) return false;
  if (fEstado !== 'Todos' && estadoDe(it) !== { 'Sin hacer': 'nuevo', 'En curso': 'curso', 'Hechos': 'hecho' }[fEstado]) return false;
  return true;
}
function fila(it) {
  const ts = itemTemas(it), b = ts.map(bloqueOf).find(Boolean), sc = it.kind === 'json' ? statsFor(it.id) : null;
  const f = el('div', 'fila'); f.dataset.b = b || 'x';
  const a = el('a', 'fl'); a.href = it.url;
  const ins = el('div', 'ins' + (b ? '' : ' sin'));
  ins.title = it.kind === 'html' ? 'Sin clasificar' : temaLabel(it.tema);
  ins.append(el('b', '', b ? codigoTema(it.tema) : '?'));
  if (ts.length > 1) ins.append(el('small', '', `+${ts.length - 1}`));
  const main = el('div'), meta = el('div', 'fmeta'), day = fmtDay(it.fecha);
  const corto = _temario.byId[it.tema] ? _temario.byId[it.tema].corto : (it.kind === 'html' ? 'Sin clasificar' : it.tema);
  const et = etiquetasTest(it.titulo);
  if (et.length) { const tg = el('span', 'tags'); et.forEach(x => tg.append(el('span', 'ntag n-' + x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''), x))); meta.append(tg); }
  meta.append(el('span', '', corto), el('span', 'org', it.fuente));
  if (it.n) meta.append(el('span', '', `${it.n} preguntas`));
  if (day) meta.append(el('span', '', `${day.d} ${day.m}`));
  main.append(el('div', 'ftit', it.titulo), meta);
  a.append(ins, main);
  if (sc) { const r = el('div', 'fres' + (sc.ultimoPct < 60 ? ' low' : '')); r.append(el('b', '', sc.ultimoPct + ' %'), el('span', '', `último, ${plural(sc.intentos, 'intento', 'intentos')}`)); a.append(r); }
  f.append(a);
  if (it.kind === 'json') { const e = el('a', 'btn small ghost fe', 'Editar'); e.href = `editar.html?t=${encodeURIComponent(it.id)}`; e.setAttribute('aria-label', `Editar: ${it.titulo}`); f.append(e); }
  return f;
}
function renderList() {
  const q = $('buscar').value.trim().toLowerCase(), prefs = getPrefs();
  const orden = ORDENES[prefs.orden] ? prefs.orden : 'recientes', pp = TAMANOS.includes(prefs.pp) ? prefs.pp : 10;
  const vis = items.filter(it => matches(it) && (it.titulo + ' ' + etiquetasTest(it.titulo).join(' ') + ' ' + itemTemas(it).map(temaLabel).join(' ') + ' ' + it.fuente + ' ' + fmtDate(it.fecha)).toLowerCase().includes(q)).sort(ORDENES[orden][1]);
  const paginas = pp ? Math.max(1, Math.ceil(vis.length / pp)) : 1;
  if (pagina > paginas) pagina = paginas;
  const trozo = pp ? vis.slice((pagina - 1) * pp, pagina * pp) : vis;
  $('cuenta').textContent = items.length ? (vis.length === items.length ? plural(vis.length, 'test', 'tests') : `${vis.length} de ${items.length} tests`) : '';
  const list = $('lista'); list.replaceChildren();
  if (!vis.length) {
    list.append(el('p', 'vacio-msg', items.length ? 'Ningún test coincide con el filtro.' : 'Todavía no hay tests. Usa «Añadir test» para subir el primero.'));
  } else trozo.forEach(it => list.append(fila(it)));
  $('pager').classList.toggle('hide', paginas < 2);
  $('pag').textContent = `Página ${pagina} de ${paginas}`;
  $('ant').disabled = pagina <= 1; $('sig').disabled = pagina >= paginas;
  $('ant').classList.toggle('off', pagina <= 1); $('sig').classList.toggle('off', pagina >= paginas);
}
function renderChips() {
  const box = $('chips'); box.replaceChildren();
  const alt = () => { pagina = 1; renderChips(); renderList(); };
  // contenedor, texto, contador (null = sin contador), activo, acción, id de bloque (para el color)
  const mk = (cont, txt, n, on, fn, b) => {
    const c = el('button', 'chip' + (on ? ' on' : '') + (n === 0 ? ' vacio' : ''), txt); c.type = 'button';
    if (n !== null) c.append(el('span', 'n', String(n)));
    if (b) c.dataset.b = b;
    c.setAttribute('aria-pressed', String(!!on));
    if (n === 0) c.disabled = true; else c.addEventListener('click', fn);
    cont.append(c); return c;
  };
  if (fTema) mk(box, `Tema ${codigoTema(fTema)} ✕`, null, true, () => { fTema = null; alt(); });
  const sinClas = it => it.kind === 'html' || !itemTemas(it).some(t => bloqueOf(t));
  const nBloque = b => items.filter(it => b === 'Sin clasificar' ? sinClas(it) : itemTemas(it).some(t => bloqueOf(t) === b)).length;
  if (items.length) {
    mk(box, 'Todos', null, fBloque === 'Todos', () => { fBloque = 'Todos'; alt(); });
    _temario.bloques.forEach(b => mk(box, `Bloque ${b.id}`, nBloque(b.id), fBloque === b.id, () => { fBloque = b.id; alt(); }, b.id));
    const ns = nBloque('Sin clasificar');
    if (ns) mk(box, 'Sin clasificar', ns, fBloque === 'Sin clasificar', () => { fBloque = 'Sin clasificar'; alt(); }, 'x');
  }
  const fe = $('chips-estado'); fe.replaceChildren();
  if (items.length) {
    fe.append(el('span', 'rot', 'Estado'));
    const cuenta = { nuevo: 0, curso: 0, hecho: 0 }; items.forEach(it => { cuenta[estadoDe(it)]++; });
    mk(fe, 'Todos', null, fEstado === 'Todos', () => { fEstado = 'Todos'; alt(); });
    [['Sin hacer', 'nuevo'], ['En curso', 'curso'], ['Hechos', 'hecho']].forEach(([t, k]) => mk(fe, t, cuenta[k], fEstado === t, () => { fEstado = t; alt(); }));
  }
  const fb = $('chips-origen'); fb.replaceChildren();
  const fuentes = [...new Set(items.map(i => i.fuente))].sort((a, b) => a.localeCompare(b, 'es'));
  if (fuentes.length >= 2) {
    fb.append(el('span', 'rot', 'Origen'));
    ['Todos', ...fuentes].forEach(f => mk(fb, f, null, fFuente === f, () => { fFuente = f; alt(); }));
  }
}
function initControles() {
  const prefs = getPrefs();
  const o = $('orden'); Object.entries(ORDENES).forEach(([k, v]) => { const op = el('option', '', v[0]); op.value = k; o.append(op); });
  o.value = ORDENES[prefs.orden] ? prefs.orden : 'recientes';
  const p = $('pp'); TAMANOS.forEach(n => { const op = el('option', '', n ? String(n) : 'Todos'); op.value = String(n); p.append(op); });
  p.value = String(TAMANOS.includes(prefs.pp) ? prefs.pp : 10);
  o.addEventListener('change', () => { setPref('orden', o.value); pagina = 1; renderList(); });
  p.addEventListener('change', () => { setPref('pp', Number(p.value)); pagina = 1; renderList(); });
  $('ant').addEventListener('click', () => { pagina--; renderList(); $('seccion-tests').scrollIntoView({ behavior: 'smooth' }); });
  $('sig').addEventListener('click', () => { pagina++; renderList(); $('seccion-tests').scrollIntoView({ behavior: 'smooth' }); });
  $('buscar').addEventListener('input', () => { pagina = 1; renderList(); });
}
function renderPractica() {
  const box = $('practica'); box.replaceChildren();
  const nErr = Object.keys(getErr()).length, nDud = Object.keys(getDud()).length, total = totalPreguntas();
  const m = el('div', 'mixto' + (total ? '' : ' off'));
  const bub = el('div', 'mixto-bub'); bub.setAttribute('aria-hidden', 'true');
  ['A', 'B', 'C', 'D'].forEach((l, i) => bub.append(el('i', i === 2 ? 'x' : '', l)));
  m.append(bub, el('h3', '', 'Test mixto'),
    el('p', '', total ? `Preguntas al azar de todos tus tests (${plural(total, 'pregunta', 'preguntas')}). ¿Cuántas?` : 'Aparecerá cuando haya tests publicados.'));
  const ch = el('div', 'nchips');
  [10, 20, 30, 50, 70, 100].filter(x => x < total).forEach(x => { const a = el('a', '', String(x)); a.href = `test.html?t=mixto&n=${x}`; ch.append(a); });
  if (total) { const a = el('a', '', 'Todas'); a.href = `test.html?t=mixto&n=${total}`; ch.append(a); }
  m.append(ch);
  const lado = el('div', 'hoy-lado');
  const tarjeta = (n, titulo, vacio, lleno, href) => {
    const a = el('a', 'accion' + (n ? '' : ' off')); a.href = href;
    a.append(el('span', 'accion-n', String(n)), el('h3', '', titulo), el('p', '', n ? lleno : vacio)); return a;
  };
  lado.append(
    tarjeta(nErr, 'Errores', 'Nada pendiente de repasar.', `${plural(nErr, 'pregunta fallada', 'preguntas falladas')} por repasar.`, 'test.html?t=errores'),
    tarjeta(nDud, 'Dudas', 'Ninguna pregunta marcada con la estrella.', `${plural(nDud, 'pregunta marcada', 'preguntas marcadas')} con la estrella.`, 'test.html?t=dudosas'));
  box.append(m, lado);
}
async function init() {
  initControles();
  await loadTemario();
  const r = await cargarCatalogo();
  if (!r.ok) { $('lista').replaceChildren(el('p', 'aviso', 'No se pudo cargar la lista de tests. Puede ser el límite de la API de GitHub; recarga en unos minutos.')); return; }
  renderChips(); renderList(); renderPractica();
  if (r.invalid.length) $('avisos').append(el('p', 'aviso', 'Estos archivos tienen errores y no se muestran: ' + r.invalid.join(', ') + '. Revísalos en «Añadir test».'));
}
init();
</script>
<script src="temporizador.js?v=20261126"></script>
</body>
</html>
