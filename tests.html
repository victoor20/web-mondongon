<body data-pagina="tests">
<div class="wrap">
  <div class="pagehead pagehead-fila">
    <div>
      <h1 class="titular">Tests</h1>
      <p class="entradilla">Practica con preguntas mezcladas o abre un test concreto.</p>
    </div>
    <div class="acciones"><a class="btn ghost" href="repasos.html">Errores y dudas</a><a class="btn" href="nuevo.html">Añadir test</a></div>
  </div>

  <section class="practica-sec" aria-labelledby="pr-t">
    <h2 class="h-sec" id="pr-t">Practicar</h2>
    <div class="hoy-grid" id="practica"></div>
  </section>

  <section id="seccion-tests">
    <h2 class="h-sec">Todos tus tests</h2>
    <div class="filtros hoja pad">
      <input type="search" id="buscar" placeholder="Buscar un test" aria-label="Buscar un test">
      <div class="chips" id="chips"></div>
      <div class="chips tema-row hide" id="chips-tema"></div>
      <div class="chips estado" id="chips-estado"></div>
      <div class="chips origen" id="chips-origen"></div>
    </div>
    <div class="barra">
      <label>Mostrar <select id="pp" aria-label="Tests por página"></select></label>
      <label>Ordenar <select id="orden" aria-label="Orden"></select></label>
      <span class="fine" id="cuenta"></span>
      <button type="button" class="btn small ghost limpiar hide" id="limpiar">Quitar filtros</button>
    </div>
    <div class="lista" id="lista"><p class="vacio-msg">Cargando tests…</p></div>
    <div class="pager hide" id="pager">
      <button type="button" class="btn small ghost" id="ant">Anterior</button>
      <span id="pag"></span>
      <button type="button" class="btn small ghost" id="sig">Siguiente</button>
    </div>
    <div id="avisos"></div>
  </section>
</div>
<script src="app.js?v=20261223"></script>
<script src="vistas.js?v=20261223"></script>
<script>
let fBloque = 'Todos', fTema = new URLSearchParams(location.search).get('tema'), fFuente = new URLSearchParams(location.search).get('fuente') || 'Todos', fEstado = 'Todos', pagina = 1;
const ORDENES = {
  recientes: ['Más recientes primero', (a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.id.localeCompare(a.id)],
  antiguos: ['Más antiguos primero', (a, b) => (a.fecha || '').localeCompare(b.fecha || '') || a.id.localeCompare(b.id)],
  nombre: ['Nombre (A–Z)', (a, b) => a.titulo.localeCompare(b.titulo, 'es', { numeric: true })],
  peor: ['Peor nota primero', (a, b) => ((statsFor(a.id) || { ultimoPct: 101 }).ultimoPct) - ((statsFor(b.id) || { ultimoPct: 101 }).ultimoPct)],
  sinhacer: ['Sin hacer primero', (a, b) => (statsFor(a.id) ? 1 : 0) - (statsFor(b.id) ? 1 : 0) || (b.fecha || '').localeCompare(a.fecha || '')]
};
const TAMANOS = [5, 10, 25, 50, 100, 0];     // 0 = todos
const itemTemas = it => Object.keys(it.temas || {});
const slugOrigen = f => String(f || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
const hayFiltros = () => !!(fTema || fBloque !== 'Todos' || fEstado !== 'Todos' || fFuente !== 'Todos' || $('buscar').value.trim());
function estadoDe(it) {                                         // 'curso' > 'hecho' > 'nuevo'
  if (it.kind === 'json') { const q = it.url.slice(it.url.indexOf('?')), c = cursosRaw()[q]; if (c && !c.del) return 'curso'; }
  return statsFor(it.id) ? 'hecho' : 'nuevo';
}
function matches(it) {
  if (fTema && !itemTemas(it).includes(fTema)) return false;
  if (fFuente !== 'Todos' && it.fuente !== fFuente) return false;
  if (fBloque === 'Simulacros') return it.tema === TEMA_SIM;
  if (fBloque === 'Sin clasificar') return it.kind === 'html' || (it.tema !== TEMA_SIM && !itemTemas(it).some(t => bloqueOf(t)));
  if (fBloque !== 'Todos' && !itemTemas(it).some(t => bloqueOf(t) === fBloque)) return false;
  if (fEstado !== 'Todos' && estadoDe(it) !== { 'Sin hacer': 'nuevo', 'En curso': 'curso', 'Hechos': 'hecho' }[fEstado]) return false;
  return true;
}
function fila(it) {
  const ts = itemTemas(it), sim = it.tema === TEMA_SIM, b = sim ? 'S' : ts.map(bloqueOf).find(Boolean), sc = it.kind === 'json' ? statsFor(it.id) : null;
  const f = el('div', 'fila'); f.dataset.b = b || 'x';
  const a = el('a', 'fl'); a.href = it.url;
  const ins = el('div', 'ins' + (b ? '' : ' sin'));
  ins.title = it.kind === 'html' ? 'Sin clasificar' : temaLabel(it.tema);
  ins.append(el('b', '', sim ? 'SIM' : b ? codigoTema(it.tema) : '?'));
  if (ts.length > 1 && !sim) ins.append(el('small', '', `+${ts.length - 1}`));
  const main = el('div'), meta = el('div', 'fmeta'), day = fmtDay(it.fecha);
  const corto = sim ? 'Simulacro' : _temario.byId[it.tema] ? _temario.byId[it.tema].corto : (it.kind === 'html' ? 'Sin clasificar' : it.tema);
  const et = etiquetasTest(it.titulo);
  if (et.length) { const tg = el('span', 'tags'); et.forEach(x => tg.append(el('span', 'ntag n-' + x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''), x))); meta.append(tg); }
  meta.append(el('span', '', corto), el('span', 'org org-' + slugOrigen(it.fuente), it.fuente));
  if (it.n) meta.append(el('span', '', `${it.n} preguntas`));
  if (day) meta.append(el('span', '', `${day.d} ${day.m}`));
  main.append(el('div', 'ftit', it.titulo), meta);
  a.append(ins, main);
  if (sc) { const r = el('div', 'fres' + (sc.ultimoPct < 60 ? ' low' : '')); r.append(el('b', '', sc.ultimoPct + ' %'), el('span', '', `último, ${plural(sc.intentos, 'intento', 'intentos')}`)); a.append(r); }
  f.append(a);
  if (it.kind === 'json') { const e = el('a', 'btn small ghost fe', 'Editar'); e.href = `editar.html?t=${encodeURIComponent(it.id)}`; e.setAttribute('aria-label', `Editar: ${it.titulo}`); f.append(e); }
  return f;
}
function renderList() {
  const q = $('buscar').value.trim().toLowerCase(), prefs = getPrefs();
  const orden = ORDENES[prefs.orden] ? prefs.orden : 'recientes', pp = TAMANOS.includes(prefs.pp) ? prefs.pp : 10;
  const vis = items.filter(it => matches(it) && (it.titulo + ' ' + etiquetasTest(it.titulo).join(' ') + ' ' + itemTemas(it).map(temaLabel).join(' ') + ' ' + it.fuente + ' ' + fmtDate(it.fecha)).toLowerCase().includes(q)).sort(ORDENES[orden][1]);
  const paginas = pp ? Math.max(1, Math.ceil(vis.length / pp)) : 1;
  if (pagina > paginas) pagina = paginas;
  const trozo = pp ? vis.slice((pagina - 1) * pp, pagina * pp) : vis;
  $('cuenta').textContent = items.length ? (vis.length === items.length ? plural(vis.length, 'test', 'tests') : `${vis.length} de ${items.length} tests`) : '';
  const list = $('lista'); list.replaceChildren();
  if (!vis.length) {
    list.append(el('p', 'vacio-msg', items.length ? 'Ningún test coincide con el filtro.' : 'Todavía no hay tests. Usa «Añadir test» para subir el primero.'));
  } else trozo.forEach(it => list.append(fila(it)));
  $('limpiar').classList.toggle('hide', !hayFiltros());
  $('pager').classList.toggle('hide', paginas < 2);
  $('pag').textContent = `Página ${pagina} de ${paginas}`;
  $('ant').disabled = pagina <= 1; $('sig').disabled = pagina >= paginas;
  $('ant').classList.toggle('off', pagina <= 1); $('sig').classList.toggle('off', pagina >= paginas);
}
function renderChips() {
  const box = $('chips'); box.replaceChildren();
  const alt = () => { if (fTema && fBloque !== 'Todos' && bloqueOf(fTema) !== fBloque) fTema = null; pagina = 1; renderChips(); renderList(); renderPractica(); };
  // contenedor, texto, contador (null = sin contador), activo, acción, id de bloque (para el color)
  const mk = (cont, txt, n, on, fn, b) => {
    const c = el('button', 'chip' + (on ? ' on' : '') + (n === 0 ? ' vacio' : ''), txt); c.type = 'button';
    if (n !== null) c.append(el('span', 'n', String(n)));
    if (b) c.dataset.b = b;
    c.setAttribute('aria-pressed', String(!!on));
    if (n === 0) c.disabled = true; else c.addEventListener('click', fn);
    cont.append(c); return c;
  };
  const bqSel = fBloque !== 'Todos' && fBloque !== 'Sin clasificar' && fBloque !== 'Simulacros' ? _temario.bloques.find(b => b.id === fBloque) : null;
  if (fTema && !bqSel) mk(box, `Tema ${codigoTema(fTema)} ✕`, null, true, () => { fTema = null; alt(); });
  const ft = $('chips-tema'); ft.replaceChildren(); ft.classList.toggle('hide', !bqSel);
  if (bqSel) {                                                      // un solo desplegable con los temas del bloque, en vez de un botón por tema
    const cnt = t => items.filter(it => itemTemas(it).includes(t)).length, sl = el('select');
    sl.setAttribute('aria-label', 'Tema del bloque ' + bqSel.id);
    sl.append(new Option(`Todos los temas del bloque (${items.filter(it => itemTemas(it).some(t => bloqueOf(t) === bqSel.id)).length})`, ''));
    bqSel.temas.forEach(t => { const n = cnt(t.id); if (n) sl.append(new Option(`${codigoTema(t.id)} · ${t.corto} (${n})`, t.id)); });
    if (fTema && ![...sl.options].some(o => o.value === fTema)) sl.append(new Option(`${codigoTema(fTema)} (0)`, fTema));
    sl.value = fTema || '';
    sl.addEventListener('change', () => { fTema = sl.value || null; pagina = 1; renderChips(); renderList(); renderPractica(); });
    ft.append(el('span', 'rot', 'Tema'), sl);
  }
  const sinClas = it => it.kind === 'html' || (it.tema !== TEMA_SIM && !itemTemas(it).some(t => bloqueOf(t)));
  const nBloque = b => items.filter(it => b === 'Simulacros' ? it.tema === TEMA_SIM : b === 'Sin clasificar' ? sinClas(it) : itemTemas(it).some(t => bloqueOf(t) === b)).length;
  if (items.length) {
    mk(box, 'Todos', null, fBloque === 'Todos', () => { fBloque = 'Todos'; alt(); });
    _temario.bloques.forEach(b => mk(box, `Bloque ${b.id}`, nBloque(b.id), fBloque === b.id, () => { fBloque = b.id; alt(); }, b.id));
    const nsim = nBloque('Simulacros');
    if (nsim) mk(box, 'Simulacros', nsim, fBloque === 'Simulacros', () => { fBloque = 'Simulacros'; alt(); }, 'S');
    const ns = nBloque('Sin clasificar');
    if (ns) mk(box, 'Sin clasificar', ns, fBloque === 'Sin clasificar', () => { fBloque = 'Sin clasificar'; alt(); }, 'x');
  }
  const fe = $('chips-estado'); fe.replaceChildren();
  if (items.length) {
    fe.append(el('span', 'rot', 'Estado'));
    const cuenta = { nuevo: 0, curso: 0, hecho: 0 }; items.forEach(it => { cuenta[estadoDe(it)]++; });
    mk(fe, 'Todos', null, fEstado === 'Todos', () => { fEstado = 'Todos'; alt(); });
    [['Sin hacer', 'nuevo'], ['En curso', 'curso'], ['Hechos', 'hecho']].forEach(([t, k]) => mk(fe, t, cuenta[k], fEstado === t, () => { fEstado = t; alt(); }));
  }
  const fb = $('chips-origen'); fb.replaceChildren();
  const fuentes = [...new Set(items.map(i => i.fuente))].sort((a, b) => a.localeCompare(b, 'es'));
  if (fFuente !== 'Todos' && !fuentes.includes(fFuente)) fFuente = 'Todos';
  if (fuentes.length >= 2) {
    fb.append(el('span', 'rot', 'Origen'));
    ['Todos', ...fuentes].forEach(f => { const c = mk(fb, f, null, fFuente === f, () => { fFuente = f; alt(); }); if (f !== 'Todos') c.classList.add('o-' + slugOrigen(f)); });
  }
}
function initControles() {
  const prefs = getPrefs();
  const o = $('orden'); Object.entries(ORDENES).forEach(([k, v]) => { const op = el('option', '', v[0]); op.value = k; o.append(op); });
  o.value = ORDENES[prefs.orden] ? prefs.orden : 'recientes';
  const p = $('pp'); TAMANOS.forEach(n => { const op = el('option', '', n ? String(n) : 'Todos'); op.value = String(n); p.append(op); });
  p.value = String(TAMANOS.includes(prefs.pp) ? prefs.pp : 10);
  o.addEventListener('change', () => { setPref('orden', o.value); pagina = 1; renderList(); });
  p.addEventListener('change', () => { setPref('pp', Number(p.value)); pagina = 1; renderList(); });
  $('ant').addEventListener('click', () => { pagina--; renderList(); $('seccion-tests').scrollIntoView({ behavior: 'smooth' }); });
  $('sig').addEventListener('click', () => { pagina++; renderList(); $('seccion-tests').scrollIntoView({ behavior: 'smooth' }); });
  $('buscar').addEventListener('input', () => { pagina = 1; renderList(); });
  $('limpiar').addEventListener('click', () => {
    fBloque = 'Todos'; fEstado = 'Todos'; fFuente = 'Todos'; pagina = 1; $('buscar').value = '';
    if (fTema) { fTema = null; try { history.replaceState(null, '', location.pathname); } catch (e) { /* nada */ } }
    renderChips(); renderList(); renderPractica();
  });
}
/* ---------- test mixto a medida ---------- */
const mx = { bloque: '', temas: new Set(), nuevos: false, abierto: false };
let mxEl = null;
const mxFuente = () => fFuente !== 'Todos' ? fFuente : '';
const mxItems = () => items.filter(i => i.kind === 'json' && (!mxFuente() || i.fuente === mxFuente()) && (!mx.nuevos || !statsFor(i.id)));
const mxCuenta = f => mxItems().reduce((s, i) => s + Object.entries(i.temas || {}).filter(([t]) => f(t)).reduce((a, e) => a + e[1], 0), 0);
const mxVale = t => mx.temas.size ? mx.temas.has(t) : (mx.bloque ? bloqueOf(t) === mx.bloque : true);
function mxUrl(n) {
  let u = 'test.html?t=mixto&n=' + n;
  if (mx.temas.size) u += '&temas=' + encodeURIComponent([...mx.temas].join(',')); else if (mx.bloque) u += '&bloque=' + mx.bloque;
  if (mx.nuevos) u += '&solo=nuevos'; if (mxFuente()) u += '&fuente=' + encodeURIComponent(mxFuente());
  return u;
}
function mxResumen() {
  const base = mx.temas.size ? (mx.temas.size === 1 ? temaLabel([...mx.temas][0]) : mx.temas.size + ' temas del bloque ' + mx.bloque) : mx.bloque ? 'el bloque ' + mx.bloque : (mxFuente() ? 'tus tests de origen ' + mxFuente() : 'todos tus tests');
  return base + (mx.nuevos ? ', solo de los que aún no has hecho' : '') + (mxFuente() && (mx.temas.size || mx.bloque) ? ', origen ' + mxFuente() : '');
}
function repintaMixto(foco) { const n = mixtoCard(); if (mxEl && mxEl.parentNode) mxEl.replaceWith(n); mxEl = n; if (foco && $(foco)) $(foco).focus(); }
function mixtoCard() {
  const hay = mxCuenta(() => true), total = mxCuenta(mxVale), m = el('div', 'mixto' + (hay ? '' : ' off'));
  const h = el('h3'), ic = el('span', 'mx-ico'); ic.setAttribute('aria-hidden', 'true');
  ic.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c3 0 4.5 2 6 5s3 5 6 5H21M3 17h3.5c1.4 0 2.5-.5 3.4-1.4M14.1 8.4C15 7.5 16.1 7 17.5 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>';
  h.append(ic, 'Test mixto');
  m.append(h, el('p', '', hay ? `Preguntas al azar de ${mxResumen()}. Hay ${plural(total, 'pregunta', 'preguntas')} disponibles; ¿cuántas quieres?` : 'Aparecerá cuando haya tests publicados.'));
  const ch = el('div', 'nchips'); ch.setAttribute('role', 'group'); ch.setAttribute('aria-label', 'Número de preguntas');
  [10, 20, 30, 50, 70, 100].filter(x => x < total).forEach(x => { const a = el('a', '', String(x)); a.href = mxUrl(x); ch.append(a); });
  if (total) { const a = el('a', '', total < 10 ? `Las ${total}` : 'Todas'); a.href = mxUrl(total); ch.append(a); }
  m.append(ch);
  if (hay) {
    const d = el('details', 'mx-opc'), s = el('summary', '', 'Personalizar'), act = mx.bloque || mx.temas.size || mx.nuevos;
    if (act) s.append(el('span', 'mx-act', 'activo'));
    d.open = mx.abierto; d.append(s);
    d.addEventListener('toggle', () => { mx.abierto = d.open; $('practica').classList.toggle('mx-abierto', d.open); });
    const lb = el('label', 'mx-f', 'Bloque'), sb = el('select'); sb.id = 'mx-b';
    sb.append(new Option('Todos los bloques', ''));
    _temario.bloques.forEach(b => { const n = mxCuenta(t => bloqueOf(t) === b.id); if (n) sb.append(new Option(`Bloque ${b.id}: ${b.titulo} (${plural(n, 'pregunta', 'preguntas')})`, b.id)); });
    sb.value = mx.bloque; sb.addEventListener('change', () => { mx.bloque = sb.value; mx.temas.clear(); repintaMixto('mx-b'); });
    lb.append(sb); d.append(lb);
    const bq = mx.bloque && _temario.bloques.find(b => b.id === mx.bloque);
    if (bq) {
      const bx = el('fieldset', 'mx-temas'); bx.append(el('legend', '', 'Temas (si no marcas ninguno, entran todos)'));
      const li = el('div', 'mx-lista');
      bq.temas.forEach(t => {
        const n = mxCuenta(x => x === t.id); if (!n) return;
        const l = el('label', 'fc-op'), c = el('input'); c.type = 'checkbox'; c.id = 'mx-t-' + t.id; c.checked = mx.temas.has(t.id);
        c.addEventListener('change', () => { if (c.checked) mx.temas.add(t.id); else mx.temas.delete(t.id); repintaMixto(c.id); });
        l.append(c, ` ${codigoTema(t.id)} · ${t.corto} (${n})`); li.append(l);
      });
      bx.append(li);
      if (mx.temas.size) { const q = el('button', 'btn small ghost', 'Quitar selección'); q.type = 'button'; q.addEventListener('click', () => { mx.temas.clear(); repintaMixto(); }); bx.append(q); }
      d.append(bx);
    }
    const ln = el('label', 'fc-op'), cn = el('input'); cn.type = 'checkbox'; cn.id = 'mx-n'; cn.checked = mx.nuevos;
    cn.addEventListener('change', () => { mx.nuevos = cn.checked; repintaMixto('mx-n'); });
    ln.append(cn, ' Solo preguntas de tests que aún no he hecho'); d.append(ln);
    if (total >= 5) {
      const f = el('form', 'mx-num'), i = el('input'), b = el('button', 'btn small', 'Empezar'); i.type = 'number'; i.min = '5'; i.max = String(total); i.placeholder = 'Otro número'; i.setAttribute('aria-label', 'Otro número de preguntas');
      f.addEventListener('submit', e => { e.preventDefault(); const n = Math.max(5, Math.min(total, parseInt(i.value, 10) || 0)); if (i.value) location.href = mxUrl(n); });
      f.append(i, b); d.append(f);
    }
    m.append(d);
  }
  return m;
}
function renderPractica() {
  const box = $('practica'); box.replaceChildren();
  const nErr = Object.keys(getErr()).length, nDud = Object.keys(getDud()).length;
  const m = mixtoCard(); mxEl = m; box.classList.toggle('mx-abierto', !!mx.abierto);
  const lado = el('div', 'hoy-lado');
  const tarjeta = (n, titulo, vacio, lleno, href) => {
    const a = el('a', 'accion' + (n ? '' : ' off')); a.href = href;
    a.append(el('span', 'accion-n', String(n)), el('h3', '', titulo), el('p', '', n ? lleno : vacio)); return a;
  };
  lado.append(
    tarjeta(nErr, 'Errores', 'Nada pendiente de repasar.', `${plural(nErr, 'pregunta fallada', 'preguntas falladas')} por repasar.`, 'test.html?t=errores'),
    tarjeta(nDud, 'Dudas', 'Ninguna pregunta marcada con la estrella.', `${plural(nDud, 'pregunta marcada', 'preguntas marcadas')} con la estrella.`, 'test.html?t=dudosas'));
  box.append(m, lado);
}
async function init() {
  initControles();
  await loadTemario();
  const r = await cargarCatalogo();
  if (!r.ok) { $('lista').replaceChildren(el('p', 'aviso', 'No se pudo cargar la lista de tests. Puede ser el límite de la API de GitHub; recarga en unos minutos.')); return; }
  renderChips(); renderList(); renderPractica();
  if (r.invalid.length) $('avisos').append(el('p', 'aviso', 'Estos archivos tienen errores y no se muestran: ' + r.invalid.join(', ') + '. Revísalos en «Añadir test».'));
}
init();
</script>
