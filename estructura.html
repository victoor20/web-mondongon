<script>
/* Estructura de una norma (Título, Capítulo, Sección) con sus preguntas. Los datos de la norma están en estructura-XX.json:
   para añadir otra norma (por ejemplo la LOTC) basta otro archivo y una línea en NORMA_URL. */
const NORMA_URL = { ce: 'estructura-ce.json', lotc: 'estructura-lotc.json' };
const N = (new URLSearchParams(location.search).get('n') || 'ce').toLowerCase();
const COLORES = ['I', 'II', 'III', 'IV', 'V', 'VI'];
let EST = null, QA = [];                                           // QA: cada pregunta con los artículos de esta norma que cita

const rango = (d, h) => d === h ? 'Artículo ' + d : 'Artículos ' + d + ' a ' + h;
const espec = (d, h) => EST.norma + '.' + d + '-' + h;
function comprime(nums) {                                          // [22,23,24,30] -> «22 a 24, 30»
  const out = []; let i = 0;
  while (i < nums.length) {
    let j = i; while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    out.push(j - i >= 2 ? nums[i] + ' a ' + nums[j] : nums.slice(i, j + 1).join(', ')); i = j + 1;
  }
  return out.join(', ');
}
function acierto(d, h) {                                           // acierto en los últimos 3 intentos que tocaron este tramo
  const hist = getHist().slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')), esL = EST.norma === 'LOTC';
  let r = 0, t = 0, usados = 0;
  for (const e of hist) {
    if (!e.ar) continue;
    let er = 0, et = 0;
    Object.keys(e.ar).forEach(k => {
      if ((k.charAt(0) === 'L') !== esL) return;
      const n = parseInt(esL ? k.slice(1) : k, 10);
      if (n >= d && n <= h) { er += e.ar[k][0]; et += e.ar[k][1]; }
    });
    if (et) { r += er; t += et; if (++usados === 3) break; }
  }
  return t ? { p: Math.round(r / t * 100), intentos: usados } : null;
}
function datos(d, h) {
  const preg = QA.filter(x => x.arts.some(a => a >= d && a <= h)), cub = new Set(), err = getErr(), porArt = {};
  QA.forEach(x => x.arts.forEach(a => { if (a >= d && a <= h) cub.add(a); }));
  const sin = []; for (let a = d; a <= h; a++) if (!cub.has(a)) sin.push(a);
  let ne = 0;
  preg.forEach(x => { if (err[x.q.key]) { ne++; x.arts.forEach(a => { if (a >= d && a <= h) porArt[a] = (porArt[a] || 0) + 1; }); } });
  const flojos = Object.keys(porArt).map(Number).sort((a, b) => porArt[b] - porArt[a] || a - b).slice(0, 5);
  return { n: preg.length, preg: preg, cubiertos: cub.size, total: h - d + 1, sin: sin, ne: ne, flojos: flojos, acc: acierto(d, h) };
}

/* ---------- pedir más preguntas a ChatGPT ---------- */
let tMsg = 0;
async function copia(texto) {
  const msg = $('e-msg'); clearTimeout(tMsg); msg.replaceChildren();
  const cierra = () => { clearTimeout(tMsg); msg.replaceChildren(); };
  const fila = txt => {
    const f = el('div', 'est-aviso'), x = el('button', 'mini', 'Cerrar');
    x.type = 'button'; x.setAttribute('aria-label', 'Cerrar el aviso'); x.addEventListener('click', cierra);
    f.append(el('span', '', txt), x); return f;
  };
  try { await navigator.clipboard.writeText(texto); msg.append(fila('Copiado. Pégalo en ChatGPT y, cuando tengas el documento, súbelo en «Añadir test».')); tMsg = setTimeout(cierra, 7000); }
  catch (e) {
    msg.append(fila('No he podido copiarlo solo. Selecciona este texto y cópialo a mano:'));
    const ta = el('textarea'); ta.readOnly = true; ta.value = texto; ta.rows = 10; msg.append(ta); ta.focus(); ta.select();
  }
  msg.scrollIntoView({ block: 'nearest' });
}
const BOE = { CE: 'https://www.boe.es/buscar/act.php?id=BOE-A-1978-31229', LOTC: 'https://www.boe.es/buscar/act.php?id=BOE-A-1979-23709' };
function promptMas(d, h, x) {
  const t = _temario.byId[EST.tema], b = t ? _temario.bloques.find(bb => bb.temas.indexOf(t) >= 0) : null;
  let max = 0; QA.forEach(z => { const m = /Ampliaci[oó]n\s*0*(\d+)/i.exec(z.q.testTitulo || ''); if (m) max = Math.max(max, +m[1]); });
  const nn = String(max + 1).padStart(2, '0'), nombre = EST.nombre.replace(/ de \d{4}$/, '');
  const fecha = new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  const rg = d === h ? 'ARTÍCULO ' + d : 'ARTÍCULOS ' + d + '–' + h, suf = EST.norma === 'LOTC' ? ' LOTC' : '';
  const L = [];
  L.push('Actúa como redactor y revisor jurídico de preguntas para las oposiciones de ingreso libre al Cuerpo General Administrativo de la Administración del Estado (C1, INAP). Toma como referencia el estilo, la precisión y la dificultad de los cuestionarios oficiales del INAP. Las preguntas que redactes son de elaboración propia, no oficiales.', '');
  L.push('Formato del examen real: 4 opciones (A–D) con una sola correcta; cada error resta un tercio, así que las opciones incorrectas deben ser tentadoras y no absurdas.', '');
  L.push('1. DATOS');
  L.push('- Norma: ' + EST.nombre + '.');
  if (t) L.push('- Bloque ' + (b ? b.id : 'I') + ', tema ' + t.n + ': ' + t.corto + '.');
  L.push('- Ámbito: ' + rango(d, h).toLowerCase() + '. Respeta estrictamente ese ámbito; puedes relacionar artículos comprendidos dentro de él.');
  L.push('- Preguntas nuevas: hasta 20 (es un objetivo, no una obligación).');
  if (x.sin.length) L.push('- Artículos de este tramo sin ninguna pregunta (prioritarios): ' + comprime(x.sin) + '.');
  if (x.flojos.length) L.push('- Artículos en los que más fallo (refuérzalos con preguntas de matiz): ' + x.flojos.sort((a, c) => a - c).join(', ') + '.');
  L.push('- Fuente principal: texto consolidado vigente en el BOE' + (BOE[EST.norma] ? ' (' + BOE[EST.norma] + ')' : '') + '. No inventes competencias, plazos, mayorías ni requisitos; si no puedes verificar un dato, descarta esa pregunta.', '');
  L.push('2. PREGUNTAS QUE YA TENGO');
  if (x.preg.length) {
    L.push('Mi banco tiene ' + x.preg.length + ' preguntas en este ámbito (entre corchetes, el artículo que citan; al final, la respuesta correcta). Antes de escribir, analiza qué apartados y conceptos ya están evaluados y busca los que no. No repitas ninguna ni hagas variantes que evalúen la misma distinción jurídica con otras palabras. Puedes tratar un artículo ya evaluado si examinas un aspecto sustancialmente distinto: otro apartado, una excepción, un sujeto, un plazo, una relación con otro artículo o un supuesto práctico breve. Analiza también la cobertura de los apartados concretos de cada artículo, no solo del artículo completo: un artículo con varias preguntas puede tener apartados sin evaluar. Prioriza las disposiciones relevantes aún no evaluadas (sujetos, garantías, prohibiciones, excepciones, condiciones, obligaciones o remisiones) y no hagas más preguntas sobre un apartado ya bien cubierto si hay otros sin evaluar.');
    x.preg.forEach(z => L.push('- [' + (String(z.q.ref || '').replace(/\s+/g, ' ').trim() || 'sin referencia') + '] ' + String(z.q.q).replace(/\s+/g, ' ').trim() + ' Correcta: ' + String((z.q.opciones || [])[z.q.correcta] || '').replace(/\s+/g, ' ').trim()));
  } else L.push('Todavía no tengo preguntas de este ámbito.');
  L.push('Si no hay contenido nuevo suficiente para 20 preguntas sin repeticiones sustanciales, entrega menos. Prefiero pocas y distintas a muchas parecidas.', '');
  L.push('3. DIFICULTAD Y ALTERNATIVAS');
  L.push('- Dificultad objetivo: alta y realista, comparable en precisión, literalidad y capacidad de discriminación a las preguntas exigentes de los exámenes oficiales del INAP para Administrativo C1. Prioriza distinciones jurídicas sutiles entre alternativas plausibles: la correcta no debe poder identificarse por descarte, por longitud ni por estar mejor redactada. No confundas dificultad con ambigüedad: cada pregunta tiene una única respuesta inequívoca y verificable en el BOE vigente.');
  L.push('- Varía el enfoque: enunciado directo, «señale la opción INCORRECTA», comparación entre dos artículos próximos, diferencias entre obligación, facultad y prohibición, plazos y mayorías, sujetos y órganos competentes, supuestos breves y, en algunas, tres afirmaciones numeradas con I, II y III (nunca con 1, 2, 3) y opciones que combinan cuáles son ciertas. No hace falta usarlos todos.');
  L.push('- Los tres distractores deben ser jurídicamente plausibles, próximos a la norma real e incorrectos por una diferencia concreta que se pueda explicar con el artículo. Una opción no puede ser incorrecta solo por ser más incompleta que la correcta: si omite parte de lo que dice el artículo pero lo que afirma es cierto, se puede defender y debe evitarse.');
  L.push('- Evita opciones absurdas, «todas las anteriores» y «ninguna de las anteriores», el uso mecánico de «siempre», «nunca» o «únicamente», y que la correcta destaque por ser más larga o más cuidada.');
  L.push('- Reparte la letra correcta de forma equilibrada entre A, B, C y D, sin secuencias predecibles (ABCD repetido, AABB…).', '');
  L.push('4. REVISIÓN ANTES DE ENTREGAR');
  L.push('Para cada pregunta comprueba que está en el ámbito, que no duplica mi banco, que la correcta coincide con el texto vigente, que las otras tres son incorrectas por motivos identificables, que no hay una segunda respuesta defendible, que el artículo y apartado del solucionario son exactos y que la explicación no contradice la solución. Si una pregunta no lo supera, corrígela o sustitúyela.', '');
  L.push('5. FORMATO DE ENTREGA');
  L.push('Entrégalo como UN documento en Markdown con exactamente esta estructura, sin texto antes ni después:', '');
  L.push('# AMPLIACIÓN ' + nn + ' — ' + nombre.toUpperCase() + ' (' + rg + ')');
  L.push('**Bloque ' + (b ? b.id : 'I') + ':** ' + (b ? b.titulo : ''));
  L.push('**Tema ' + (t ? t.n : 1) + ':** ' + (t ? t.corto : ''));
  L.push('**Fecha:** ' + fecha);
  L.push('**Preguntas:** (número real de preguntas que entregues)', '');
  L.push('# PREGUNTAS', '**1. Enunciado de la pregunta.**', 'A) Opción', 'B) Opción', 'C) Opción', 'D) Opción', '');
  L.push('# SOLUCIONARIO Y EXPLICACIONES', '| Nº | Correcta | Artículo |', '|---|---|---|', '| 1 | D | ' + d + suf + ' |', '');
  L.push('**1. Respuesta D — Artículo ' + d + suf + '.** Explicación de 1-2 frases: apartado exacto del artículo y por qué falla la opción incorrecta más tentadora.', '');
  L.push('Reglas: 4 opciones por pregunta (A–D) sin numeraciones extra; no cambies los encabezados ni el orden de las secciones; no reveles respuestas en la sección PREGUNTAS; si una pregunta enumera afirmaciones, numéralas I, II, III (con 1., 2., 3. el documento no se lee bien); escribe siempre el número del artículo con cifras (22.4), nunca con letras.' + (suf ? ' Termina siempre cada referencia con LOTC (por ejemplo, «Artículo 2.1.a LOTC»), también en la tabla del solucionario; si citas también la Constitución, añade CE a esa parte.' : ''));
  return L.join('\n');
}
function pideMas(d, h) { copia(promptMas(d, h, datos(d, h))); }

/* ---------- tarjetas ---------- */
function botones(d, h, x, completo) {
  const ac = el('div', 'nota-ac');
  if (x.n) { const a = el('a', 'mini azul', typeof completo === 'string' ? completo : completo ? 'Hacer test de este título' : 'Hacer test'); a.href = 'test.html?t=mixto&art=' + espec(d, h) + '&n=20'; ac.append(a); }
  if (x.ne) { const e = el('a', 'mini err', 'Errores (' + x.ne + ')'); e.href = 'test.html?t=errores&art=' + espec(d, h); ac.append(e); }
  const m = el('button', 'mini', 'Pedir más preguntas'); m.type = 'button'; m.addEventListener('click', () => pideMas(d, h)); ac.append(m);
  return ac;
}
function partes(t) {                                               // «Capítulo II. Derechos y libertades» -> ['Capítulo II', 'Derechos y libertades']
  const m = /^((?:Cap[ií]tulo|Secci[oó]n|T[ií]tulo)\s+[^\s.]+(?:\s+bis)?(?:\.ª)?)\.\s+(.+)$/.exec(t);
  return m ? [m[1], m[2]] : ['', t];
}
function cifras(x) {                                               // tres cifras grandes: preguntas, artículos con pregunta y acierto
  const f = el('div', 'est-cifras');
  const c = (n, t) => { const s = el('span', 'est-cifra'); s.append(el('b', '', String(n)), document.createTextNode(' ' + t)); return s; };
  f.append(c(x.n, x.n === 1 ? 'pregunta' : 'preguntas'), c(x.cubiertos + ' de ' + x.total, x.total === 1 ? 'artículo con pregunta' : 'artículos con pregunta'));
  if (x.acc) f.append(c(x.acc.p + ' %', 'de acierto reciente'));
  return f;
}
function medidor(x) { const m = el('span', 'meter est-cob'), f = el('i'); f.style.width = Math.round(x.cubiertos / x.total * 100) + '%'; m.append(f); return m; }
function cuerpo(c, x, d, h, etiquetaTest) {
  if (x.n) {
    c.append(cifras(x), medidor(x));
    if (x.sin.length) c.append(el('p', 'fine est-sin', 'Sin pregunta: ' + comprime(x.sin) + '.'));
    if (!x.acc) c.append(el('p', 'fine', 'Todavía no hay datos de acierto en este tramo.'));
  } else c.append(el('p', 'est-m', 'Sin preguntas todavía.'));
  c.append(botones(d, h, x, etiquetaTest));
}
function tarjetaTramo(titulo, d, h) {                              // nivel más bajo: una sección o un artículo suelto
  const x = datos(d, h), c = el('article', 'nota-card est-tr'), [et, nombre] = partes(titulo);
  if (et) c.append(el('span', 'est-etq', et));
  c.append(el('h3', 'est-t', nombre));
  if (titulo !== rango(d, h)) c.append(el('p', 'fine est-rg', rango(d, h)));
  cuerpo(c, x, d, h, false);
  return c;
}
function bloqueCap(g, color) {                                     // nivel intermedio: un capítulo con sus secciones dentro
  const sec = el('section', 'est-cap'), x = datos(g.desde, g.hasta), [et, nombre] = partes(g.titulo);
  sec.dataset.b = color;
  const cab = el('header', 'est-cap-cab');
  if (et) cab.append(el('span', 'est-etq', et));
  cab.append(el('h2', 'est-cap-t', nombre));
  if (g.titulo !== rango(g.desde, g.hasta)) cab.append(el('p', 'fine est-rg', rango(g.desde, g.hasta)));
  sec.append(cab);
  cuerpo(sec, x, g.desde, g.hasta, g.tramos ? 'Hacer test del capítulo' : false);
  if (g.tramos) {
    const subs = el('div', 'est-subs');
    g.tramos.forEach(s => subs.append(tarjetaTramo(s.titulo, s.desde, s.hasta)));
    sec.append(subs);
  }
  return sec;
}

/* ---------- vistas ---------- */
function vistaRaiz() {
  const box = $('e-box'), tot = datos(1, EST.ultimo);
  document.title = 'Estructura - Mi Academia';
  $('e-h1').textContent = EST.nombre;
  $('e-ent').textContent = tot.n ? plural(tot.n, 'pregunta', 'preguntas') + ' cubren ' + tot.cubiertos + ' de ' + EST.ultimo + ' artículos (una pregunta puede citar más de uno). Abre un título para ver sus capítulos, practicar un tramo o pedir más preguntas.' : 'Todavía no hay preguntas de esta norma.';
  box.replaceChildren();
  const barra = el('div', 'est-barra');
  const sel = el('div', 'est-norma');                               // cambiar entre las normas del tema
  [['ce', 'Constitución'], ['lotc', 'LOTC']].forEach(k => { const a = el('a', 'btn small' + (k[0] === N ? '' : ' ghost'), k[1]); a.href = 'estructura.html?n=' + k[0]; if (k[0] === N) a.setAttribute('aria-current', 'page'); sel.append(a); });
  barra.append(sel);
  if (tot.n) { const a = el('a', 'btn small', 'Test de toda la ' + EST.corto); a.href = 'test.html?t=mixto&art=' + espec(1, EST.ultimo) + '&n=20'; barra.append(a); }
  const t0 = el('a', 'btn small ghost', 'Volver al temario'); t0.href = 'temario.html#tema-' + EST.tema; barra.append(t0);
  box.append(barra);
  const grid = el('div', 'bib-grid');
  EST.titulos.forEach((t, i) => {
    const x = datos(t.desde, t.hasta), a = el('a', 'bib-bloque'); a.dataset.b = COLORES[i % COLORES.length]; a.href = '#' + t.id;
    a.append(el('span', 'rn', t.rn), el('h3', '', t.titulo.replace(/^Título [IVX]+(?: bis)?\.\s*/, '')), el('p', 'fine', rango(t.desde, t.hasta)),
      el('p', 'fine', x.n ? plural(x.n, 'pregunta', 'preguntas') + '. ' + x.cubiertos + ' de ' + plural(x.total, 'artículo', 'artículos') + ' con pregunta.' : 'Sin preguntas todavía.'), el('span', 'bib-flecha'));
    grid.append(a);
  });
  box.append(grid);
}
function vistaTitulo(t, i) {
  const box = $('e-box'), x = datos(t.desde, t.hasta), color = COLORES[i % COLORES.length];
  document.title = t.titulo + ' - Mi Academia';
  $('e-h1').textContent = t.titulo;
  $('e-ent').textContent = rango(t.desde, t.hasta) + '. ' + (x.n ? plural(x.n, 'pregunta', 'preguntas') + ', ' + x.cubiertos + ' de ' + plural(x.total, 'artículo', 'artículos') + ' con pregunta.' : 'Todavía no hay preguntas de este título.');
  box.replaceChildren();
  const hero = el('section', 'est-hero'); hero.dataset.b = color;
  const hc = el('div', 'est-hero-c');
  hero.append(el('span', 'est-rn', t.rn), hc);
  cuerpo(hc, x, t.desde, t.hasta, true);
  box.append(hero);
  const grupos = t.grupos || [];
  if (!grupos.length) box.append(el('p', 'fine', 'Este título no se divide en capítulos.'));
  grupos.forEach(g => box.append(bloqueCap(g, color)));
}
function ruta() {
  if (!EST) return;
  $('e-msg').replaceChildren();
  const id = decodeURIComponent(location.hash.slice(1)), i = EST.titulos.findIndex(t => t.id === id);
  if (i >= 0) vistaTitulo(EST.titulos[i], i); else vistaRaiz();
  window.scrollTo(0, 0);
}
async function init() {
  await loadTemario();
  const url = NORMA_URL[N];
  try {
    if (!url) throw new Error('norma');
    const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); EST = await r.json();
  } catch (e) { $('e-ent').textContent = 'No he podido cargar la estructura. Comprueba la conexión e inténtalo de nuevo.'; return; }
  const qs = await todasLasPreguntas();
  QA = qs.map(q => ({ q: q, arts: refInfo(q).filter(r => r.norma === EST.norma).map(r => r.n) }));
  ruta();
}
$('e-volver').addEventListener('click', ev => {                    // vuelve a la página de antes; si no hay, al temario
  ev.preventDefault();
  if (history.length > 1) history.back(); else location.href = 'temario.html#tema-' + (EST ? EST.tema : 'I-1');
});
window.addEventListener('hashchange', ruta);
init();
</script>
